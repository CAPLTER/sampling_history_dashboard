name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r arthropod_timeline/requirements.txt
          pip install -r bird_timeline/requirements.txt

      # Each script writes its own page into the shared build/ directory and
      # its own CSVs into its dataset directory's output/. NLCD lookups come
      # from the committed common/nlcd_lookup.json cache; a site whose
      # coordinate is not yet cached requires the MRLC service to be
      # reachable, and either script raises rather than completing with
      # missing land-use if it is not.
      - name: Build arthropod dashboard
        run: python arthropod_timeline/build_timeline.py

      - name: Build bird dashboard
        run: python bird_timeline/build_birds.py

      - name: Verify build outputs
        run: |
          ls -la build
          test -f build/index.html
          test -f build/birds.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
